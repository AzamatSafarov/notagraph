<!DOCTYPE html>

<html lang="en" style="color-scheme: dark;">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="%234d8eff" stroke-width="4"/><circle cx="50" cy="50" r="8" fill="%234d8eff"/><circle cx="30" cy="35" r="5" fill="%23a78bfa"/><circle cx="70" cy="65" r="5" fill="%23a78bfa"/><line x1="50" y1="50" x2="30" y2="35" stroke="%234d8eff" stroke-width="1.5"/><line x1="50" y1="50" x2="70" y2="65" stroke="%234d8eff" stroke-width="1.5"/></svg>'>

  <meta name="theme-color" content="#0a0a0f">

  
    <meta property="og:title" content="Obsidian Universe - Neural Cartography of Ideas">
    <meta property="og:description" content="Visualize your notes as a 3D knowledge graph. Multi-provider AI embeddings + LLM annotations.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://topologies-of-ideas-universal.vercel.app">
    <meta name="description" content="Visualize your notes as a 3D knowledge graph with AI embeddings and LLM annotations.">

    <title>Obsidian Universe</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    /* ═══════════════════════════════════════════════

       CSS Custom Properties

       ═══════════════════════════════════════════════ */

    :root {

      --bg: #f2efe9;

      --bg-panel: rgba(255, 255, 255, 0.82);

      --border: rgba(60, 60, 80, 0.12);

      --text: #3a3a4a;

      --text-dim: #8a8a9a;

      --text-bright: #1a1a2a;

      --mono: 'JetBrains Mono', monospace;

      --serif: 'Cormorant Garamond', 'EB Garamond', Georgia, serif;

      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;

      --coral: #ff6b6b;

      --teal: #4ecdc4;

      --yellow: #ffd93d;

      --purple: #a78bfa;

      --green: #51cf66;

      --blue: #4dabf7;

      --pink: #ff9ff3;

      --accent: #4dabf7;

    }



    /* ═══════════════════════════════════════════════

       Reset & Base

       ═══════════════════════════════════════════════ */

    * {

      margin: 0;

      padding: 0;

      box-sizing: border-box;

    }



    body {

      background: var(--bg);

      color: var(--text);

      font-family: var(--sans);

      overflow: hidden;

      height: 100vh;

      width: 100vw;

    }







    :focus-visible {

      outline: 2px solid var(--blue);

      outline-offset: 2px;

    }



    :focus:not(:focus-visible) {

      outline: none;

    }



    .hidden {

      display: none !important;

    }



    /* ═══════════════════════════════════════════════

       Setup Screen

       ═══════════════════════════════════════════════ */

    #setup {

      width: 100vw;

      height: 100vh;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 14px;

      background: linear-gradient(180deg, #f5f2ec 0%, #ede9e2 100%);

      position: relative;

      overflow: hidden;

    }
#setup-card, .setup-card {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(60, 60, 80, 0.12);
      border-radius: 16px;
      padding: 28px 32px;
      box-shadow: 0 8px 32px rgba(60, 60, 80, 0.08), 0 2px 8px rgba(60, 60, 80, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      max-width: 420px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: relative;
      z-index: 2;
    }




    #bg-canvas {

      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      height: 100%;

      pointer-events: none;

      z-index: 0;

    }



    #setup-title {

      font-family: var(--serif);

      font-size: 44px;

      font-weight: 600;

      letter-spacing: 0.01em;

      color: var(--text-bright);

      position: relative;

      z-index: 1;

    }



    #setup-subtitle {

      font-family: var(--mono);

      font-size: 11px;

      letter-spacing: 0.15em;

      text-transform: uppercase;

      color: var(--text-dim);

      margin-top: 2px;

      margin-bottom: 24px;

      z-index: 1;

      position: relative;

    }



    #api-key-label, #api-key-label, .setup-field-label {

      font-family: var(--mono);

      font-size: 9px;

      letter-spacing: 0.12em;

      color: var(--text-dim);

      margin-bottom: 5px;

      text-transform: uppercase;

      z-index: 1;

      position: relative;

    }



    #api-key-input {

      background: rgba(255, 255, 255, 0.9);

      border: 1px solid rgba(60, 60, 80, 0.15);

      border-radius: 10px;

      color: var(--text-bright);

      font-family: var(--mono);

      font-size: 13px;

      padding: 12px 16px;

      width: 340px;

      box-sizing: border-box;

      letter-spacing: 0.04em;

      transition: border-color 200ms ease, box-shadow 200ms ease;

      z-index: 1;

      position: relative;

      backdrop-filter: blur(4px);

    }



    #api-key-input::placeholder {

      color: var(--text-dim);

    }



    #api-key-input:focus {

      border-color: var(--blue);

      box-shadow: 0 0 0 3px rgba(77, 171, 247, 0.12);

    }



    .setup-model-input {

      background: rgba(255, 255, 255, 0.9);

      border: 1px solid rgba(60, 60, 80, 0.15);

      border-radius: 10px;

      color: var(--text-bright);

      font-family: var(--mono);

      font-size: 12px;

      padding: 10px 16px;

      width: 340px;

      box-sizing: border-box;

      letter-spacing: 0.04em;

      transition: border-color 200ms ease, box-shadow 200ms ease;

      z-index: 1;

      position: relative;

      backdrop-filter: blur(4px);

    }

    .setup-model-input::placeholder { color: var(--text-dim); }

    .setup-model-input:focus {

      border-color: var(--blue);

      box-shadow: 0 0 0 3px rgba(77, 171, 247, 0.12);

    }



    #provider-select {

      background: rgba(255, 255, 255, 0.9);

      border: 1px solid rgba(60, 60, 80, 0.15);

      border-radius: 10px;

      color: var(--text-bright);

      font-family: var(--mono);

      font-size: 12px;

      letter-spacing: 0.08em;

      text-transform: uppercase;

      padding: 10px 16px;

      width: 340px;

      box-sizing: border-box;

      cursor: pointer;

      margin-bottom: 4px;

      outline: none;

      transition: border-color 200ms ease;

      z-index: 1;

      position: relative;

      backdrop-filter: blur(4px);

    }

    #provider-select option { background: #fff; color: var(--text-bright); }

    #provider-select:focus { border-color: var(--blue); }



    #pick-folder-btn {

      background: linear-gradient(135deg, #4dabf7, #a78bfa);

      border: none;

      border-radius: 10px;

      color: #ffffff;

      font-family: var(--mono);

      font-size: 13px;

      font-weight: 700;

      letter-spacing: 0.12em;

      text-transform: uppercase;

      padding: 16px 24px;

      width: 340px;

      box-sizing: border-box;

      cursor: pointer;

      transition: all 200ms ease;

      margin-top: 8px;

      z-index: 1;

      position: relative;

      box-shadow: 0 4px 16px rgba(77, 171, 247, 0.3);

    }



    #pick-folder-btn:hover {

      transform: translateY(-2px);

      box-shadow: 0 8px 26px rgba(77, 171, 247, 0.45);

      filter: brightness(1.08);

    }



    #load-cache-btn {

      background: rgba(255, 255, 255, 0.85);

      border: 1px solid rgba(60, 60, 80, 0.15);

      border-radius: 10px;

      color: #4dabf7;

      font-family: var(--mono);

      font-size: 11px;

      font-weight: 600;

      letter-spacing: 0.10em;

      text-transform: uppercase;

      padding: 12px 24px;

      width: 340px;

      box-sizing: border-box;

      cursor: pointer;

      transition: all 200ms ease;

      z-index: 1;

      position: relative;

      box-shadow: 0 2px 8px rgba(0,0,0,0.06);

    }



    #load-cache-btn:hover {

      border-color: #4dabf7;

      color: #3a8de0;

      box-shadow: 0 4px 14px rgba(77, 171, 247, 0.15);

    }



    #setup-status {

      font-family: var(--mono);

      font-size: 11px;

      color: var(--text-dim);

      letter-spacing: 0.06em;

      min-height: 1.4em;

      margin-top: 8px;

      z-index: 1;

      position: relative;

    }



    #provider-select {

      background: transparent;

      border: 1px solid var(--border);

      border-radius: 0;

      color: var(--text);

      font-family: var(--mono);

      font-size: 12px;

      letter-spacing: 0.08em;

      text-transform: uppercase;

      padding: 8px 10px;

      width: 320px;

      box-sizing: border-box;

      cursor: pointer;

      margin-bottom: 12px;

      outline: none;

    }

    #provider-select option { background: #0a0a0f; color: var(--text); }

    #provider-select:focus { border-color: var(--blue); }



    .setup-field-label {

      font-family: var(--mono);

      font-size: 10px;

      letter-spacing: 0.12em;

      color: var(--text-dim);

      margin-bottom: 4px;

      margin-top: 10px;

    }



    .setup-model-input {

      background: transparent;

      border: 1px solid var(--border);

      border-radius: 0;

      color: var(--text);

      font-family: var(--mono);

      font-size: 12px;

      padding: 8px 14px;

      width: 320px;

      box-sizing: border-box;

      letter-spacing: 0.04em;

      transition: border-color 200ms ease;

    }

    .setup-model-input::placeholder { color: var(--text-dim); }

    .setup-model-input:focus { border-color: var(--blue); }



    #copy-graph-link-btn {

      position: fixed;

      top: 88px;

      left: 20px;

      z-index: 10;

      background: var(--bg-panel);

      backdrop-filter: blur(8px);

      -webkit-backdrop-filter: blur(8px);

      border: 1px solid var(--border);

      border-radius: 8px;

      color: var(--text-dim);

      font-family: var(--mono);

      font-size: 11px;

      letter-spacing: 0.10em;

      text-transform: uppercase;

      padding: 8px 14px;

      cursor: pointer;

      transition: color 200ms ease, border-color 200ms ease;

    }

    #copy-graph-link-btn:hover {

      color: var(--text-bright);

      border-color: var(--accent);

    }



    #export-snapshot-btn {

      position: fixed;

      top: 128px;

      left: 20px;

      z-index: 10;

      background: var(--bg-panel);

      backdrop-filter: blur(8px);

      -webkit-backdrop-filter: blur(8px);

      border: 1px solid var(--border);

      border-radius: 6px;

      color: var(--text-dim);

      font-family: var(--mono);

      font-size: 11px;

      letter-spacing: 0.10em;

      text-transform: uppercase;

      padding: 8px 14px;

      cursor: pointer;

      transition: color 200ms ease, border-color 200ms ease;

    }

    #export-snapshot-btn:hover {

      border-color: var(--blue);

      color: var(--text-bright);

    }



    /* ═══════════════════════════════════════════════

       Main View

       ═══════════════════════════════════════════════ */



    /* -- Graph container -- */

    #graph {

      width: 100vw;

      height: 100vh;

      position: absolute;

      top: 0;

      left: 0;

    }



    /* -- Title (top-left) -- */

    #title {

      position: fixed;

      top: 20px;

      left: 20px;

      z-index: 10;

      font-family: var(--serif);

      font-size: 20px;

      font-weight: 600;

      letter-spacing: 0.01em;

      color: var(--text);

      pointer-events: none;

    }



    #reanalyze-btn {

      position: fixed;

      top: 48px;

      left: 20px;

      z-index: 10;

      background: var(--bg-panel);

      backdrop-filter: blur(8px);

      -webkit-backdrop-filter: blur(8px);

      border: 1px solid var(--border);

      border-radius: 6px;

      color: var(--text-dim);

      font-family: var(--mono);

      font-size: 10px;

      letter-spacing: 0.10em;

      text-transform: uppercase;

      padding: 5px 12px;

      cursor: pointer;

      transition: border-color 200ms ease, color 200ms ease;

    }



    #reanalyze-btn:hover {

      border-color: var(--blue);

      color: var(--blue);

    }



    /* -- Topology Switcher (top-center) -- */

    #controls {

      position: fixed;

      top: 20px;

      left: 50%;

      transform: translateX(-50%);

      display: flex;

      align-items: stretch;

      background: var(--bg-panel);

      backdrop-filter: blur(12px);

      -webkit-backdrop-filter: blur(12px);

      border: 1px solid var(--border);

      border-radius: 10px;

      z-index: 10;

      box-shadow: 0 2px 12px rgba(0,0,0,0.06);

    }



    #controls button {

      background: transparent;

      color: var(--text-dim);

      border: none;

      padding: 8px 18px;

      border-bottom: 2px solid transparent;

      border-radius: 0;

      cursor: pointer;

      font-family: var(--mono);

      font-size: 11px;

      font-weight: 500;

      letter-spacing: 0.10em;

      text-transform: uppercase;

      white-space: nowrap;

      transition: color 200ms ease, border-color 200ms ease;

    }



    #controls button:hover {

      color: var(--text);

    }



    #controls button.active {

      color: var(--blue);

      border-bottom-color: var(--blue);

    }



    /* Dividers between control buttons */

    #controls button + button {

      border-left: 1px solid var(--border);

    }



    /* -- Info Panel (left side: network stats + clusters + key hint) -- */

    #info-panel {

      position: fixed;

      top: 50%;

      left: 20px;

      transform: translateY(-50%);

      z-index: 10;

      background: var(--bg-panel);

      backdrop-filter: blur(12px);

      -webkit-backdrop-filter: blur(12px);

      border: 1px solid var(--border);

      border-radius: 10px;

      font-family: var(--mono);

      font-size: 11px;

      letter-spacing: 0.06em;

      text-transform: uppercase;

      color: var(--text-dim);

      pointer-events: none;

      min-width: 180px;

      box-shadow: 0 2px 12px rgba(0,0,0,0.06);

    }



    .info-section {

      padding: 7px 12px;

    }



    .info-section + .info-section {

      border-top: 1px solid var(--border);

    }



    .info-row {

      display: flex;

      justify-content: space-between;

      gap: 16px;

      margin-bottom: 2px;

      line-height: 1.5;

    }



    .info-row:last-child {

      margin-bottom: 0;

    }



    .info-key {

      color: var(--text-dim);

      flex-shrink: 0;

    }



    .info-val {

      color: var(--text-bright);

      text-align: right;

    }



    #key-hint {

      position: fixed;

      bottom: 16px;

      left: 50%;

      transform: translateX(-50%);

      font-family: var(--mono);

      font-size: 11px;

      letter-spacing: 0.1em;

      color: var(--text-dim);

      opacity: 0.6;

      pointer-events: none;

      z-index: 10;

    }



    /* -- Layout Description (below controls) -- */

    #layout-desc {

      position: fixed;

      top: 58px;

      left: 50%;

      transform: translateX(-50%);

      z-index: 10;

      font-family: var(--mono);

      font-size: 11px;

      letter-spacing: 0.06em;

      color: var(--text-dim);

      pointer-events: none;

      white-space: nowrap;

    }



    /* -- Boot Status Overlay (centered) -- */

    #boot-status {

      position: fixed;

      top: 50%;

      left: 50%;

      transform: translate(-50%, -50%);

      z-index: 20;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 8px;

      pointer-events: none;

    }



    #boot-stage {

      font-family: var(--mono);

      font-size: 16px;

      font-weight: 500;

      letter-spacing: 0.10em;

      text-transform: uppercase;

      color: var(--text-bright);

    }



    #boot-detail {

      font-family: var(--mono);

      font-size: 12px;

      letter-spacing: 0.06em;

      color: var(--text-dim);

    }



    /* -- Side Panel (Detail Card) -- */

    #detail-card {

      position: fixed;

      top: 0;

      right: 0;

      width: var(--panel-width, 360px);

      height: 100vh;

      overflow-y: auto;

      background: var(--bg-panel);

      backdrop-filter: blur(16px);

      -webkit-backdrop-filter: blur(16px);

      border-left: 1px solid var(--border);

      z-index: 15;

      padding: 24px;

      transform: translateX(100%);

      transition: transform 300ms ease;

      box-shadow: -4px 0 24px rgba(0,0,0,0.08);

    }



    #detail-card.visible {

      transform: translateX(0);

    }



    /* -- Panel Resize Handle -- */

    #panel-resize {

      position: fixed;

      top: 0;

      width: 5px;

      height: 100vh;

      cursor: col-resize;

      z-index: 16;

      background: transparent;

      transition: background 150ms ease;

      display: none;

    }



    #panel-resize:hover,

    #panel-resize.dragging {

      background: var(--blue);

    }



    /* Scrollbar styling for detail card */

    #detail-card::-webkit-scrollbar {

      width: 4px;

    }



    #detail-card::-webkit-scrollbar-track {

      background: transparent;

    }



    #detail-card::-webkit-scrollbar-thumb {

      background: var(--border);

    }



    .card-header {

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      margin-bottom: 8px;

    }



    .card-title {

      font-family: var(--serif);

      font-size: 22px;

      font-weight: 600;

      color: var(--text-bright);

      letter-spacing: 0.01em;

      word-break: break-word;

      line-height: 1.2;

    }



    #card-close {

      background: transparent;

      border: none;

      border-radius: 0;

      color: var(--text-dim);

      font-family: var(--mono);

      font-size: 16px;

      cursor: pointer;

      padding: 0 0 0 8px;

      line-height: 1;

      transition: color 200ms ease;

      flex-shrink: 0;

    }



    #card-close:hover {

      color: var(--text-bright);

    }



    #card-cluster {

      margin-bottom: 10px;

    }



    .cluster-badge {

      display: inline-block;

      border: 1px solid var(--border);

      border-radius: 3px;

      font-family: var(--mono);

      font-size: 10px;

      font-weight: 500;

      letter-spacing: 0.08em;

      text-transform: uppercase;

      padding: 3px 10px;

      color: var(--text);

    }



    #card-meta {

      border-top: 1px solid var(--border);

      padding-top: 10px;

      margin-top: 10px;

    }



    .meta-row {

      display: flex;

      gap: 8px;

      font-size: 11px;

      line-height: 1.6;

      margin-bottom: 2px;

    }



    .meta-key {

      font-family: var(--mono);

      color: var(--text-dim);

      flex-shrink: 0;

      text-transform: uppercase;

      letter-spacing: 0.04em;

    }



    .meta-val {

      font-family: var(--sans);

      color: var(--text);

      word-break: break-word;

    }



    .meta-val a {

      color: var(--blue);

      text-decoration: none;

    }



    #card-preview {

      font-family: var(--sans);

      font-size: 13px;

      line-height: 1.6;

      color: var(--text-dim);

      border-top: 1px solid var(--border);

      padding-top: 10px;

      margin-top: 10px;

      white-space: pre-wrap;

      word-break: break-word;

    }



    #card-connections {

      border-top: 1px solid var(--border);

      padding-top: 10px;

      margin-top: 10px;

    }



    .conn-header {

      font-family: var(--mono);

      font-size: 11px;

      font-weight: 500;

      letter-spacing: 0.08em;

      text-transform: uppercase;

      color: var(--text-dim);

      margin-bottom: 6px;

    }



    .conn-item {

      font-size: 11px;

      line-height: 1.4;

      padding: 8px 0;

      border-bottom: 1px solid rgba(26, 42, 58, 0.5);

    }



    .conn-item:last-child {

      border-bottom: none;

    }



    .conn-edge {

      font-family: var(--mono);

      color: var(--text-dim);

      font-size: 12px;

      letter-spacing: 0.04em;

      display: block;

      margin-bottom: 3px;

    }



    .conn-edge .arrow {

      color: var(--text-dim);

      opacity: 0.6;

    }



    .conn-edge .label {

      font-family: var(--sans);

      font-style: italic;

      color: var(--text-dim);

    }



    .conn-name {

      font-family: var(--mono);

      color: var(--text);

      display: block;

      padding-left: 16px;

      font-size: 11px;

      cursor: pointer;

      transition: color 150ms ease;

    }



    .conn-name:hover {

      color: var(--text-bright);

    }



    /* -- Markers (medoid, LLM center) -- */

    .marker.medoid {

      color: #ef4444;

    }



    .marker.ai-selected {

      color: #fb923c;

    }



    /* -- Cluster Labels Overlay -- */

    #cluster-labels {

      position: fixed;

      top: 0;

      left: 0;

      width: 100vw;

      height: 100vh;

      pointer-events: none;

      z-index: 5;

    }



    .cluster-label {

      position: absolute;

      font-family: var(--mono);

      font-size: 11px;

      letter-spacing: 0.10em;

      text-transform: uppercase;

      pointer-events: none;

    }



    /* -- Legend items inside info-panel -- */

    .legend-item {

      display: flex;

      align-items: center;

      gap: 8px;

      margin-bottom: 3px;

      line-height: 1.5;

    }



    .legend-item:last-child {

      margin-bottom: 0;

    }



    .legend-dot {

      width: 7px;

      height: 7px;

      border-radius: 999px;

      flex-shrink: 0;

    }



    .legend-label {

      font-size: 11px;

    // ═══════════════════════════════════════════════

    // Animated Pointillism Network Background

    // ═══════════════════════════════════════════════

    (function() {

      const canvas = document.getElementById('bg-canvas');

      if (!canvas) return;

      const ctx = canvas.getContext('2d');

      let W, H, particles = [];

      const COLORS = ['#ff6b6b', '#4ecdc4', '#a78bfa', '#ffd93d', '#51cf66', '#4dabf7', '#ff9ff3'];

      const MAX_DIST = 140;

      const PARTICLE_COUNT = 80;



      function resize() {

        W = canvas.width = window.innerWidth;

        H = canvas.height = window.innerHeight;

      }

      resize();

      window.addEventListener('resize', resize);



      function initParticles() {

        particles = [];

        for (let i = 0; i < PARTICLE_COUNT; i++) {

          particles.push({

            x: Math.random() * W,

            y: Math.random() * H,

            vx: (Math.random() - 0.5) * 0.4,

            vy: (Math.random() - 0.5) * 0.4,

            r: 1.5 + Math.random() * 2.5,

            color: COLORS[Math.floor(Math.random() * COLORS.length)],

            phase: Math.random() * Math.PI * 2,

          });

        }

      }

      initParticles();



      let mouseX = -1000, mouseY = -1000;

      window.addEventListener('mousemove', e => {

        mouseX = e.clientX;

        mouseY = e.clientY;

      });

      window.addEventListener('mouseleave', () => {

        mouseX = -1000; mouseY = -1000;

      });



      let t = 0;

      function animate() {

        t += 0.01;

        ctx.clearRect(0, 0, W, H);



        // Update + draw particles

        for (let i = 0; i < particles.length; i++) {

          const p = particles[i];

          p.x += p.vx;

          p.y += p.vy;



          // Bounce edges

          if (p.x < 0 || p.x > W) p.vx *= -1;

          if (p.y < 0 || p.y > H) p.vy *= -1;



          // Mouse repel

          const dx = p.x - mouseX;

          const dy = p.y - mouseY;

          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 100) {

            const force = (100 - dist) / 100;

            p.x += (dx / dist) * force * 1.5;

            p.y += (dy / dist) * force * 1.5;

          }



          // Pulse size

          const pulseR = p.r + Math.sin(t + p.phase) * 0.5;



          // Draw dot

          ctx.beginPath();

          ctx.arc(p.x, p.y, pulseR, 0, Math.PI * 2);

          ctx.fillStyle = p.color;

          ctx.globalAlpha = 0.5 + Math.sin(t + p.phase) * 0.15;

          ctx.fill();

        }



        // Draw connections

        ctx.globalAlpha = 1;

        for (let i = 0; i < particles.length; i++) {

          for (let j = i + 1; j < particles.length; j++) {

            const p1 = particles[i];

            const p2 = particles[j];

            const dx = p1.x - p2.x;

            const dy = p1.y - p2.y;

            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < MAX_DIST) {

              const alpha = (1 - dist / MAX_DIST) * 0.25;

              ctx.beginPath();

              ctx.moveTo(p1.x, p1.y);

              ctx.lineTo(p2.x, p2.y);

              ctx.strokeStyle = p1.color;

              ctx.globalAlpha = alpha;

              ctx.lineWidth = 0.8;

              ctx.stroke();

            }

          }

        }



        // Draw mouse connections

        if (mouseX > 0) {

          for (let i = 0; i < particles.length; i++) {

            const p = particles[i];

            const dx = p.x - mouseX;

            const dy = p.y - mouseY;

            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 160) {

              const alpha = (1 - dist / 160) * 0.4;

              ctx.beginPath();

              ctx.moveTo(p.x, p.y);

              ctx.lineTo(mouseX, mouseY);

              ctx.strokeStyle = p.color;

              ctx.globalAlpha = alpha;

              ctx.lineWidth = 1;

              ctx.stroke();

            }

          }

        }



        ctx.globalAlpha = 1;

        requestAnimationFrame(animate);

      }

      animate();

    })();

    const DB_NAME = 'notes-network-cache';

    const STORE_NAME = 'sessions';



    function openDB() {

      return new Promise((resolve, reject) => {

        const req = indexedDB.open(DB_NAME, DB_VERSION);

        req.onupgradeneeded = () => {

          req.result.createObjectStore(STORE_NAME, { keyPath: 'id' });

        };

        req.onsuccess = () => resolve(req.result);

        req.onerror = () => reject(req.error);

      });

    }

      return new Promise((resolve, reject) => {

        const tx = db.transaction(STORE_NAME, 'readwrite');

        tx.objectStore(STORE_NAME).put({ id: 'latest', ...data, savedAt: Date.now() });

        tx.oncomplete = () => resolve();

        tx.onerror = () => reject(tx.error);

      });

    }

        const tx = db.transaction(STORE_NAME, 'readonly');

        req.onsuccess = () => resolve(req.result || null);

        req.onerror = () => reject(req.error);

            fileStats: { totalFiles: files.length, noteFiles: filenames.length, nonNoteFiles: Math.max(0, files.length - filenames.length) },

          });

        const onFocus = () => {

              reject(new DOMException('User cancelled folder selection', 'AbortError'));

    async function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }



    const EMBED_BATCH_SIZE = 20;



    async function embedTexts(texts, config, onProgress) {

      const allEmbeddings = [];

      const provider = config.provider;



      for (let i = 0; i < texts.length; i += EMBED_BATCH_SIZE) {

        const batch = texts.slice(i, i + EMBED_BATCH_SIZE);

        let response;

        let retries = 0;

        const maxRetries = 5;



        if (provider === 'azure') {

          // Retry with backoff for rate limits

          while (retries < maxRetries) {

            response = await fetch(

              `${config.baseUrl}/openai/deployments/${config.embeddingModel}/embeddings?api-version=${config.apiVersion}`,

              {

                method: 'POST',

                headers: { 'Content-Type': 'application/json', 'api-key': config.apiKey },

                body: JSON.stringify({ input: batch }),

              }

            );

            if (response.ok) break;

            if (response.status === 429 || response.status === 503) {

              const retryAfter = Math.min(parseInt(response.headers.get('Retry-After') || '5'), 5);

              retries++;

              if (retries < maxRetries) {

                await sleep(retryAfter * 1000);

                continue;

              }

            }

            const err = await response.json().catch(() => ({}));

            throw new Error(`Azure embedding error: ${err.error?.message || response.statusText}`);

          }

          const data = await response.json();

          const vectors = data.data.map(e => e.embedding);

          allEmbeddings.push(...vectors);

        } else if (provider === 'gemini') {

          response = await fetch(

            `${config.baseUrl}/models/${config.embeddingModel}:batchEmbedContents?key=${config.apiKey}`,

            {

              method: 'POST',

              headers: { 'Content-Type': 'application/json' },

              body: JSON.stringify({

                requests: batch.map(text => ({

                  model: `models/${config.embeddingModel}`,

                  content: { parts: [{ text }] },

                })),

              }),

            }

          );

          if (!response.ok) {

            const err = await response.json().catch(() => ({}));

            throw new Error(`Gemini embedding error: ${err.error?.message || response.statusText}`);

          }

          const data = await response.json();

          const vectors = data.embeddings.map(e => e.values);

          allEmbeddings.push(...vectors);

        } else {

          // OpenAI-compatible (OpenAI, OpenRouter, Ollama)

          response = await fetch(

            `${config.baseUrl}/embeddings`,

            {

              method: 'POST',

              headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.apiKey}` },

              body: JSON.stringify({ model: config.embeddingModel, input: batch }),

            }

          );

          if (!response.ok) {

            const err = await response.json().catch(() => ({}));

            throw new Error(`Embedding error: ${err.error?.message || response.statusText}`);

          }

          const data = await response.json();

          const vectors = data.data.map(e => e.embedding);

          allEmbeddings.push(...vectors);

        }



        if (onProgress) onProgress(Math.min(i + EMBED_BATCH_SIZE, texts.length), texts.length);

      }



      return allEmbeddings;

    }

    // ═══════════════════════════════════════════════

    // Math Pipeline — Vector Ops, Clustering, PCA, k-NN

    // ═══════════════════════════════════════════════



    function dot(a, b) {

      let sum = 0;

      for (let i = 0; i < a.length; i++) sum += a[i] * b[i];

      return sum;

    }



    function vecNorm(a) {

      return Math.sqrt(dot(a, a));

    }



    function cosineDistance(a, b) {

      const d = dot(a, b) / (vecNorm(a) * vecNorm(b) + 1e-9);

      return 1 - d;

    }



    function cosineDistanceMatrix(embeddings) {

      const n = embeddings.length;

      const matrix = Array.from({ length: n }, () => new Float64Array(n));

      for (let i = 0; i < n; i++) {

        for (let j = i + 1; j < n; j++) {

          const d = cosineDistance(embeddings[i], embeddings[j]);

          matrix[i][j] = d;

          matrix[j][i] = d;

        }

      }

      return matrix;

    }



    function normalizeRange(arr) {

      let mn = Infinity, mx = -Infinity;

      for (const v of arr) { if (v < mn) mn = v; if (v > mx) mx = v; }

      const range = mx - mn || 1e-9;

      return arr.map(v => 2 * (v - mn) / range - 1);

    }



    function subtractVec(a, b) {

      return a.map((v, i) => v - b[i]);

    }



    function addVec(a, b) {

      return a.map((v, i) => v + b[i]);

    }



    function scaleVec(a, s) {

      return a.map(v => v * s);

    }



    function meanVec(vectors) {

      const n = vectors.length;

      const dim = vectors[0].length;

      const result = new Array(dim).fill(0);

      for (const v of vectors) {

        for (let i = 0; i < dim; i++) result[i] += v[i];

      }

      return result.map(v => v / n);

    }



    // --- KMeans Clustering (k-means++ init) ---



    function kmeans(embeddings, k, maxIter = 50) {

      const n = embeddings.length;

      const dim = embeddings[0].length;



      // k-means++ initialization

      const centroids = [];

      const used = new Set();

      let first = Math.floor(Math.random() * n);

      centroids.push([...embeddings[first]]);

      used.add(first);



      for (let c = 1; c < k; c++) {

        let bestIdx = 0, bestDist = -1;

        for (let i = 0; i < n; i++) {

          if (used.has(i)) continue;

          const minDist = Math.min(...centroids.map(cen => cosineDistance(embeddings[i], cen)));

          if (minDist > bestDist) { bestDist = minDist; bestIdx = i; }

        }

        centroids.push([...embeddings[bestIdx]]);

        used.add(bestIdx);

      }



      let labels = new Int32Array(n);



      for (let iter = 0; iter < maxIter; iter++) {

        let changed = false;

        for (let i = 0; i < n; i++) {

          let bestC = 0, bestD = Infinity;

          for (let c = 0; c < k; c++) {

            const d = cosineDistance(embeddings[i], centroids[c]);

            if (d < bestD) { bestD = d; bestC = c; }

          }

          if (labels[i] !== bestC) changed = true;

          labels[i] = bestC;

        }

        if (!changed) break;



        for (let c = 0; c < k; c++) {

          const members = [];

          for (let i = 0; i < n; i++) {

            if (labels[i] === c) members.push(embeddings[i]);

          }

          if (members.length > 0) centroids[c] = meanVec(members);

        }

      }



      return { labels: Array.from(labels), centroids };

    }



    // --- PCA 3D (power iteration) ---



    function pca3d(embeddings) {

      const n = embeddings.length;

      const dim = embeddings[0].length;

      const mean = meanVec(embeddings);

      const centered = embeddings.map(e => subtractVec(e, mean));

      const components = [];

      let residual = centered.map(row => [...row]);



      for (let comp = 0; comp < Math.min(3, n - 1); comp++) {

        let vec = Array.from({ length: dim }, () => Math.random() - 0.5);

        let vn = vecNorm(vec);

        vec = vec.map(v => v / vn);



        for (let iter = 0; iter < 100; iter++) {

          const projections = residual.map(row => dot(row, vec));

          const newVec = new Array(dim).fill(0);

          for (let i = 0; i < n; i++) {

            for (let j = 0; j < dim; j++) {

              newVec[j] += residual[i][j] * projections[i];

            }

          }

          vn = vecNorm(newVec);

          if (vn < 1e-12) break;

          vec = newVec.map(v => v / vn);

        }



        components.push(vec);

        const projections = residual.map(row => dot(row, vec));

        residual = residual.map((row, i) =>

          row.map((v, j) => v - projections[i] * vec[j])

        );

      }



      // Pad to 3 components if fewer

      while (components.length < 3) {

        components.push(new Array(dim).fill(0));

      }



      return centered.map(row => components.map(comp => dot(row, comp)));

    }



    // --- k-NN Edge Builder ---



    function knnEdges(distMatrix, k) {

      const n = distMatrix.length;

      const edgeSet = new Set();



      for (let i = 0; i < n; i++) {

        const neighbors = Array.from({ length: n }, (_, j) => j)

          .filter(j => j !== i)

          .sort((a, b) => distMatrix[i][a] - distMatrix[i][b])

          .slice(0, k);



        for (const j of neighbors) {

          const edge = i < j ? `${i},${j}` : `${j},${i}`;

          edgeSet.add(edge);

        }

      }



      return Array.from(edgeSet).map(e => {

        const [a, b] = e.split(',').map(Number);

        return [a, b];

      }).sort((a, b) => a[0] - b[0] || a[1] - b[1]);

    }



    // ═══════════════════════════════════════════════

    // Layout Computation — Centralized, Decentralized, Distributed

    // ═══════════════════════════════════════════════



    function fibonacciSphere(n) {

      const points = [];

      const goldenRatio = (1 + Math.sqrt(5)) / 2;

      for (let i = 0; i < n; i++) {

        const theta = Math.acos(1 - 2 * (i + 0.5) / n);

        const phi = 2 * Math.PI * i / goldenRatio;

        points.push([

          Math.sin(theta) * Math.cos(phi),

          Math.sin(theta) * Math.sin(phi),

          Math.cos(theta),

        ]);

      }

      return points;

    }



    function computeCentralizedLayout(embeddings, pcaCoords) {

      const n = embeddings.length;

      const centroid = meanVec(embeddings);



      // Find medoid (closest to centroid)

      let medoidIdx = 0, bestDist = Infinity;

      for (let i = 0; i < n; i++) {

        const d = cosineDistance(embeddings[i], centroid);

        if (d < bestDist) { bestDist = d; medoidIdx = i; }

      }



      // Spherical layout: PCA angles, cosine distance for radius

      const centerPca = pcaCoords[medoidIdx];

      const relative = pcaCoords.map(p => subtractVec(p, centerPca));



      const rPca = relative.map(r => Math.sqrt(r[0]**2 + r[1]**2 + r[2]**2) + 1e-9);

      const theta = relative.map((r, i) => Math.acos(Math.max(-1, Math.min(1, r[2] / rPca[i]))));

      const phi = relative.map(r => Math.atan2(r[1], r[0]));



      const distsFromMedoid = embeddings.map(e => cosineDistance(e, embeddings[medoidIdx]));

      const maxDist = Math.max(...distsFromMedoid) + 1e-9;

      const radii = distsFromMedoid.map(d => d / maxDist);



      const x = radii.map((r, i) => r * Math.sin(theta[i]) * Math.cos(phi[i]));

      const y = radii.map((r, i) => r * Math.sin(theta[i]) * Math.sin(phi[i]));

      const z = radii.map((r, i) => r * Math.cos(theta[i]));



      return {

        x: normalizeRange(x),

        y: normalizeRange(y),

        z: normalizeRange(z),

        medoidIdx,

      };

    }



    function computeDecentralizedLayout(embeddings, clusterLabels, k) {

      const n = embeddings.length;

      const hubPositions = fibonacciSphere(k).map(p => scaleVec(p, 0.6));

      const orbitRadius = 0.25;



      const x = new Array(n).fill(0);

      const y = new Array(n).fill(0);

      const z = new Array(n).fill(0);



      for (let c = 0; c < k; c++) {

        const indices = [];

        for (let i = 0; i < n; i++) {

          if (clusterLabels[i] === c) indices.push(i);

        }

        const nInCluster = indices.length;



        if (nInCluster === 0) continue;

        if (nInCluster === 1) {

          x[indices[0]] = hubPositions[c][0];

          y[indices[0]] = hubPositions[c][1];

          z[indices[0]] = hubPositions[c][2];

        } else if (nInCluster === 2) {

          const offset = orbitRadius * 0.3;

          x[indices[0]] = hubPositions[c][0] - offset;

          y[indices[0]] = hubPositions[c][1];

          z[indices[0]] = hubPositions[c][2];

          x[indices[1]] = hubPositions[c][0] + offset;

          y[indices[1]] = hubPositions[c][1];

          z[indices[1]] = hubPositions[c][2];

        } else {

          const clusterEmbeddings = indices.map(i => embeddings[i]);

          const localCoords = pca3d(clusterEmbeddings);

          const localMax = Math.max(...localCoords.flat().map(Math.abs)) + 1e-9;



          indices.forEach((idx, j) => {

            x[idx] = hubPositions[c][0] + (localCoords[j][0] / localMax) * orbitRadius;

            y[idx] = hubPositions[c][1] + (localCoords[j][1] / localMax) * orbitRadius;

            z[idx] = hubPositions[c][2] + (localCoords[j][2] / localMax) * orbitRadius;

          });

        }

      }



      return { x: normalizeRange(x), y: normalizeRange(y), z: normalizeRange(z) };

    }



    function computeDistributedLayout(embeddings, kNeighbors) {

      const umap = new UMAP({

        nComponents: 3,

        nNeighbors: Math.min(kNeighbors, embeddings.length - 1),

        minDist: 0.1,

        distanceFn: cosineDistance,

      });



      const coords = umap.fit(embeddings);



      return {

        x: normalizeRange(coords.map(c => c[0])),

        y: normalizeRange(coords.map(c => c[1])),

        z: normalizeRange(coords.map(c => c[2])),

      };

    }

    // --- Planet Layout: clusters as continents on a sphere ---

    function computePlanetLayout(embeddings, clusterLabels, k) {
      const n = embeddings.length;

      // Assign each cluster a center on the sphere via fibonacci distribution
      const hubCenters = fibonacciSphere(k).map(p => scaleVec(p, 0.85));

      // Count notes per cluster to size continents
      const clusterSizes = new Array(k).fill(0);
      for (let i = 0; i < n; i++) clusterSizes[clusterLabels[i]]++;
      const maxClusterSize = Math.max(...clusterSizes, 1);

      const x = new Array(n).fill(0);
      const y = new Array(n).fill(0);
      const z = new Array(n).fill(0);

      for (let c = 0; c < k; c++) {
        const indices = [];
        for (let i = 0; i < n; i++) {
          if (clusterLabels[i] === c) indices.push(i);
        }
        if (indices.length === 0) continue;

        const hub = hubCenters[c];
        // Continent radius proportional to cluster size
        const continentRadius = 0.15 + 0.25 * (clusterSizes[c] / maxClusterSize);

        if (indices.length === 1) {
          x[indices[0]] = hub[0];
          y[indices[0]] = hub[1];
          z[indices[0]] = hub[2];
        } else {
          // Local PCA for within-cluster spread
          const clusterEmbs = indices.map(i => embeddings[i]);
          const localCoords = pca3d(clusterEmbs);
          const localMax = Math.max(...localCoords.flat().map(Math.abs)) + 1e-9;

          // Build a local coordinate frame around the hub center
          // Tangent vectors to the sphere at hub point
          const up = [0, 0, 1];
          let tangent1 = [hub[1] * up[2] - hub[2] * up[1], hub[2] * up[0] - hub[0] * up[2], hub[0] * up[1] - hub[1] * up[0]];
          const t1Mag = Math.sqrt(tangent1[0]**2 + tangent1[1]**2 + tangent1[2]**2) + 1e-9;
          tangent1 = tangent1.map(v => v / t1Mag);
          let tangent2 = [hub[1] * tangent1[2] - hub[2] * tangent1[1], hub[2] * tangent1[0] - hub[0] * tangent1[2], hub[0] * tangent1[1] - hub[1] * tangent1[0]];
          const t2Mag = Math.sqrt(tangent2[0]**2 + tangent2[1]**2 + tangent2[2]**2) + 1e-9;
          tangent2 = tangent2.map(v => v / t2Mag);

          indices.forEach((idx, j) => {
            const localX = (localCoords[j][0] / localMax) * continentRadius;
            const localY = (localCoords[j][1] / localMax) * continentRadius;
            // Project onto sphere surface: move along tangent plane, then renormalize
            const px = hub[0] + tangent1[0] * localX + tangent2[0] * localY;
            const py = hub[1] + tangent1[1] * localX + tangent2[1] * localY;
            const pz = hub[2] + tangent1[2] * localX + tangent2[2] * localY;
            // Normalize to sphere radius
            const mag = Math.sqrt(px*px + py*py + pz*pz) + 1e-9;
            x[idx] = px / mag;
            y[idx] = py / mag;
            z[idx] = pz / mag;
          });
        }
      }

      return { x: x, y: y, z: z };
    }

    async function nominateCenter(notes, config) {

      const summaries = notes.map(n => `[${n.id}] ${n.text.slice(0, 150)}`).join('\n');



      const prompt = `I have a collection of personal notes. I want to find the ONE core idea that all others secretly orbit around — the gravitational center.



Here are all the notes:

${summaries}



Which ONE note (by its [id]) is the core idea that all others connect back to? Respond with:

- The note id (just the number)

- A 1-2 sentence explanation of why this is the center



Format:

CENTER: <id>

REASON: <explanation>`;



      const response = await generateContent(prompt, config);

      const match = response.match(/CENTER:\s*(\d+)/);

      return match ? parseInt(match[1]) : 0;

    }



    async function nameClusters(notes, clusterLabels, k, config) {

      let clusterInfo = '';

      for (let c = 0; c < k; c++) {

        const indices = clusterLabels.map((l, i) => l === c ? i : -1).filter(i => i >= 0);

        const clusterNotes = indices.map(i => `  [${notes[i].id}] ${notes[i].text.slice(0, 100)}`).join('\n');

        clusterInfo += `\nCLUSTER ${c} (${indices.length} notes):\n${clusterNotes}\n`;

      }



      const prompt = `I've clustered a collection of personal notes into ${k} groups. Name each cluster.



${clusterInfo}



For each cluster, give it a short name (2-4 words) that captures its theme.



Format:

CLUSTER 0: <name>

CLUSTER 1: <name>

...`;



      const response = await generateContent(prompt, config);

      const names = {};

      for (const match of response.matchAll(/CLUSTER\s+(\d+):\s*(.+)/g)) {

        names[parseInt(match[1])] = match[2].trim().replace(/\*\*/g, '');

      }

      for (let c = 0; c < k; c++) {

        if (!names[c]) names[c] = `Cluster ${c}`;

      }

      return names;

    }



    const EDGE_LABEL_BATCH = 50;



    async function labelEdges(notes, edges, config, onProgress) {

      const labeled = [];
      const PARALLEL = 3;

      for (let i = 0; i < edges.length; i += EDGE_LABEL_BATCH * PARALLEL) {

        // Launch PARALLEL batches concurrently
        const promises = [];
        for (let p = 0; p < PARALLEL; p++) {
          const start = i + p * EDGE_LABEL_BATCH;
          if (start >= edges.length) break;
          const batch = edges.slice(start, start + EDGE_LABEL_BATCH);
          promises.push(labelBatch(batch));
        }
        const results = await Promise.all(promises);
        for (const batchLabeled of results) {
          labeled.push(...batchLabeled);
          if (onProgress) onProgress(labeled.length, edges.length);
        }
      }

      return labeled;

      async function labelBatch(batch) {
        const batchLabeled = [];



        let pairsText = '';

        batch.forEach(([a, b], idx) => {

          pairsText += `\nPAIR ${idx}:\n  A [${a}]: ${notes[a].text.slice(0, 200)}\n  B [${b}]: ${notes[b].text.slice(0, 200)}\n`;

        });



        const prompt = `I have pairs of personal notes that are neighbors in an idea network. For each pair, describe the specific relationship in BOTH directions using short, actionable verb phrases (2-5 words).



Be specific and contextual — NOT generic labels like "relates to" or "is similar to". Think about HOW they connect:

- Does one inspire the other? ("could spark", "seeds the idea of")

- Is one a premise for the other? ("grounds", "is the foundation for")

- Do they contradict? ("tensions with", "challenges")

- Does one extend the other? ("builds on", "takes further")

- Does one reframe the other? ("reframes", "is the same thing seen from")



${pairsText}



Format (one line per pair):

PAIR 0: A→B: <verb phrase> | B→A: <verb phrase>

PAIR 1: A→B: <verb phrase> | B→A: <verb phrase>

...`;



        const response = await generateContent(prompt, config);



        batch.forEach(([a, b], idx) => {

          const pattern = new RegExp(`PAIR\\s+${idx}:.*?A→B:\\s*(.+?)\\s*\\|\\s*B→A:\\s*(.+?)\\s*$`, 'm');

          const match = response.match(pattern);

          const fwd = match ? match[1].trim().replace(/\.$/, '') : 'connects to';

          const bwd = match ? match[2].trim().replace(/\.$/, '') : 'connects to';

          batchLabeled.push({ source: a, target: b, label_forward: fwd, label_backward: bwd, topology: 'distrib' });

        });



        return batchLabeled;
      }

    }

    function wrapNodeLabel(name) {

      const words = (name || '').split(/\s+/).slice(0, 4);

      if (!words.length) return [];

      const maxChars = 12;

      const lines = [];

      let current = '';

      for (const word of words) {

        if (current && (current.length + 1 + word.length) > maxChars) {

          lines.push(current);

          current = word;

        } else {

          current = current ? current + ' ' + word : word;

        }

      }

      if (current) lines.push(current);

      return lines;

      hitSprite.scale.set(baseScale, baseScale, 1);

      const lines = wrapNodeLabel(node.name);

    // Pipeline Orchestrator

    // ═══════════════════════════════════════════════



    async function runPipeline(notes, config, fingerprint) {

      try {

        // ── STAGE 1: SCANNING ──

        setBootStage('SCANNING...', `${notes.length} NOTES LOADED`);

        await sleep(300); // brief pause so user sees it



        // ── STAGE 2: EMBEDDING ──

        const texts = notes.map(n => n.text.slice(0, 2000));

        const embeddings = await embedTexts(texts, config, (done, total) => {

          setBootStage('EMBEDDING...', `${done}/${total}`);

        });



        // ── STAGE 3: MAPPING IDEAS ──

        setBootStage('MAPPING IDEAS...', 'CLUSTERING');

        await sleep(50);

        const k = Math.min(N_CLUSTERS, notes.length);

        const { labels: clusterLabels } = kmeans(embeddings, k);



        setBootStage('MAPPING IDEAS...', 'PCA');

        await sleep(50);

        const pcaCoords = pca3d(embeddings);



        setBootStage('MAPPING IDEAS...', 'CENTRALIZED LAYOUT');

        await sleep(50);

        const central = computeCentralizedLayout(embeddings, pcaCoords);



        setBootStage('MAPPING IDEAS...', 'DECENTRALIZED LAYOUT');

        await sleep(50);

        const decentral = computeDecentralizedLayout(embeddings, clusterLabels, k);



        setBootStage('MAPPING IDEAS...', 'UMAP');

        await sleep(50);

        const distrib = computeDistributedLayout(embeddings, K_NEIGHBORS);

        setBootStage('MAPPING IDEAS...', 'PLANET LAYOUT');
        await sleep(50);
        const planet = computePlanetLayout(embeddings, clusterLabels, k);


        setBootStage('MAPPING IDEAS...', 'K-NN EDGES');

        await sleep(50);

        const distMatrix = cosineDistanceMatrix(embeddings);

        const edges = knnEdges(distMatrix, K_NEIGHBORS);



        // ── Compute topology-specific edge sets ──



        // Centralized: star from medoid to every other node

        const centralEdges = [];

        for (let i = 0; i < notes.length; i++) {

          if (i === central.medoidIdx) continue;

          centralEdges.push({

            source: central.medoidIdx,

            target: i,

            label_forward: 'radiates to',

            label_backward: 'orbits center',

            topology: 'central',

          });

        }



        // Decentralized: find cluster medoids, connect hub→members + hub↔hub

        const clusterMedoids = {};

        for (let c = 0; c < k; c++) {

          const members = [];

          for (let i = 0; i < notes.length; i++) {

            if (clusterLabels[i] === c) members.push(i);

          }

          if (members.length === 0) continue;

          // Find cluster medoid (closest to cluster centroid)

          const clusterEmbs = members.map(i => embeddings[i]);

          const centroid = meanVec(clusterEmbs);

          let bestIdx = members[0], bestDist = Infinity;

          for (const i of members) {

            const d = cosineDistance(embeddings[i], centroid);

            if (d < bestDist) { bestDist = d; bestIdx = i; }

          }

          clusterMedoids[c] = bestIdx;

        }



        const decentralEdges = [];

        // Hub → members

        for (let c = 0; c < k; c++) {

          const hub = clusterMedoids[c];

          if (hub === undefined) continue;

          for (let i = 0; i < notes.length; i++) {

            if (clusterLabels[i] === c && i !== hub) {

              decentralEdges.push({

                source: hub,

                target: i,

                label_forward: 'governs',

    function rebuildLookups(nodes, edges) {

      adjacency = {};

      neighborSets = {};

      nodes.forEach(n => { nodeById[n.id] = n; });

      edges.forEach(e => {

        if (!adjacency[e.source]) adjacency[e.source] = [];

        if (!adjacency[e.target]) adjacency[e.target] = [];

        adjacency[e.source].push({ id: e.target, label: e.label_forward });

        adjacency[e.target].push({ id: e.source, label: e.label_backward });

        if (!neighborSets[e.source]) neighborSets[e.source] = new Set();

        if (!neighborSets[e.target]) neighborSets[e.target] = new Set();

        neighborSets[e.source].add(e.target);

    // ── Custom position force ──



    function createPositionForce(strength) {

      let forceNodes;

      function force(alpha) {

        forceNodes.forEach(node => {

          const lk = 'x_' + currentLayout;

          const tx = (node[lk] || 0) * SCALE;

          const ty = (node['y_' + currentLayout] || 0) * SCALE;

          const tz = (node['z_' + currentLayout] || 0) * SCALE;

          node.vx += (tx - node.x) * strength * alpha;

          node.vy += (ty - node.y) * strength * alpha;

          node.vz += (tz - node.z) * strength * alpha;

        });

      }

      force.initialize = function(n) { forceNodes = n; };

      force.strength = function(s) {

        if (s === undefined) return strength;

        strength = s;

        return force;

      };

      return force;

    }

    function darken(hex, amount) {

      const b = Math.max(0, Math.round(parseInt(hex.slice(5, 7), 16) * (1 - amount)));

    // ── Side panel functions ──



    function parseFrontmatter(text) {

      const match = text.match(/^---\n([\s\S]*?)\n---\s*([\s\S]*)$/);

      if (!match) return { meta: null, body: text };



      const meta = {};

      let currentKey = null;

      for (const line of match[1].split('\n')) {

        const kvMatch = line.match(/^(\w[\w\s-]*):\s*(.*)$/);

        if (kvMatch) {

          currentKey = kvMatch[1].trim();

          const val = kvMatch[2].trim();

          if (val.startsWith('[') || val === '') {

            meta[currentKey] = val === '' ? '' : val;

          } else {

            meta[currentKey] = val;

          }

        } else if (currentKey && line.match(/^\s*-\s+/)) {

          // YAML list continuation

          const item = line.replace(/^\s*-\s+/, '').trim().replace(/^["']|["']$/g, '');

          const prev = meta[currentKey];

          meta[currentKey] = prev ? prev + ', ' + item : item;

        }

      }

      return { meta, body: match[2].trim() };

    }



    function renderMeta(meta) {

        let rendered = escapeHtml(String(val)).replace(/\[\[([^\]]+)\]\]/g, '$1');

        // Auto-link URLs

        rendered = rendered.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">link</a>');

        html += `<div class="meta-row"><span class="meta-key">${escapeHtml(key)}:</span><span class="meta-val">${rendered}</span></div>`;

      }

      return html;

    }

        const w = window.innerWidth, h = window.innerHeight;

        Graph.width(w).height(h);

        css2d.setSize(w, h);

      });



      // Post-processing bloom

      const renderer = Graph.renderer();

      const composer = new EffectComposer(renderer);

      composer.addPass(new RenderPass(Graph.scene(), Graph.camera()));

      bloomPass = new UnrealBloomPass(

        new THREE.Vector2(graphEl.clientWidth, graphEl.clientHeight),

        VFX.bloomStrength.val,

        VFX.bloomRadius.val,

        VFX.bloomThreshold.val

      );

      composer.addPass(bloomPass);

      Graph.postProcessingComposer(composer);



      // Set initial camera to the "H" recenter position

      Graph.cameraPosition({ x: 0, y: 0, z: SCALE * 2.5 }, { x: 0, y: 0, z: 0 });

    }



    // ── updateGraphData ──



    function updateGraphData(nodes, edges, refreshNodeObjects = false) {

      if (!Graph) return;

      const activeEdges = edges.filter(e => e.topology === currentLayout);

      rebuildLookups(nodes, activeEdges);

      const links = edges.map(e => ({

        source: e.source,

        target: e.target,

        label_forward: e.label_forward,

        label_backward: e.label_backward,

        topology: e.topology,

      }));

      Graph.graphData({ nodes, links });

      if (refreshNodeObjects) {
        Graph.nodeThreeObject(node => createNodeObject(node));
        Graph.d3ReheatSimulation();
      }
    }



    // ── Topology switching ──



    const LAYOUT_DESCRIPTIONS = {

      central: 'NEXUS \u2014 ANCHOR AT ORIGIN, NOTES RADIATE OUTWARD',

      decentral: 'GALAXIES \u2014 THEMATIC HUBS WITH ORBITING NOTES',

      distrib: 'SYNAPSE \u2014 UMAP PROJECTION, SEMANTIC PROXIMITY',

    
      planet: 'ORBIT \u2014 CLUSTERS AS CONTINENTS ON A SPHERE',};



    document.querySelectorAll('#controls button').forEach(btn => {

      btn.addEventListener('click', () => {

        document.querySelectorAll('#controls button').forEach(b => b.classList.remove('active'));

        btn.classList.add('active');

        currentLayout = btn.dataset.layout;

        document.getElementById('layout-desc').textContent = LAYOUT_DESCRIPTIONS[currentLayout] || '';

        if (Graph && allNodes.length) {

          const activeEdges = edgeSets[currentLayout] || [];

          // Swap visible edges without calling graphData (which resets simulation)

          Graph.linkVisibility(link => link.topology === currentLayout);

          rebuildLookups(allNodes, activeEdges);

          buildReadouts(allNodes.length, activeEdges.length);

          // Soften position force, reheat, then restore — smooth ~2s drift

          const posForce = Graph.d3Force('position');

          posForce.strength(0.03);

          Graph.d3ReheatSimulation();

          setTimeout(() => posForce.strength(0.18), 3000);

        }

      });

    });



    // Set initial layout description

    document.getElementById('layout-desc').textContent = LAYOUT_DESCRIPTIONS.central;



    // ── Legend, Cluster Labels ──



    function buildLegend(clusterNames) {

      const legend = document.getElementById('legend');

      legend.innerHTML = '';



      Object.entries(clusterNames).forEach(([id, name]) => {

        const color = CLUSTER_COLORS[id % CLUSTER_COLORS.length];

        const item = document.createElement('div');

        item.className = 'legend-item';

        item.innerHTML = `<div class="legend-dot" data-cluster-dot="${id}" style="background:${color};"></div>`

          + `<span class="legend-label">${escapeHtml(name)}</span>`;

        legend.appendChild(item);

      });



      // Special markers

      const special = document.createElement('div');

      special.className = 'legend-special';

      special.innerHTML =

        '<div class="legend-item"><div class="legend-dot" style="border:2px solid #ef4444;background:transparent;"></div><span class="legend-label">EMBEDDING ANCHOR</span></div>'

        + '<div class="legend-item"><div class="legend-dot" style="border:2px solid #fb923c;background:transparent;"></div><span class="legend-label">AI-SELECTED CENTER</span></div>';

      legend.appendChild(special);

    }



    let clusterLabelEls = {};

    let clusterLabelRAF = null;



    function buildClusterLabels(clusterNames) {

      const container = document.getElementById('cluster-labels');

      container.innerHTML = '';

      clusterLabelEls = {};



      // Cancel existing loop before starting a new one

      if (clusterLabelRAF) {

        cancelAnimationFrame(clusterLabelRAF);

        clusterLabelRAF = null;

      }



      Object.entries(clusterNames).forEach(([id, name]) => {

        const el = document.createElement('div');

        el.className = 'cluster-label';

        el.textContent = name;

        el.style.color = CLUSTER_COLORS[id % CLUSTER_COLORS.length];

        el.style.opacity = '0';

        container.appendChild(el);

        clusterLabelEls[id] = el;

      });



      clusterLabelRAF = requestAnimationFrame(updateClusterLabelPositions);

    }



    function updateClusterLabelPositions() {

      clusterLabelRAF = requestAnimationFrame(updateClusterLabelPositions);

      if (!Graph) return;

      const show = currentLayout === 'decentral';

      const nodes = Graph.graphData().nodes;



      const centers = {};

      const counts = {};

      nodes.forEach(node => {

        const c = node.cluster_id;

        if (!centers[c]) { centers[c] = { x: 0, y: 0, z: 0 }; counts[c] = 0; }

        centers[c].x += node.x;

        centers[c].y += node.y;

        centers[c].z += node.z;

        counts[c]++;

      });



      Object.entries(clusterLabelEls).forEach(([id, el]) => {

        if (!show) { el.style.opacity = '0'; return; }

        const c = centers[id];

        const n = counts[id];

        if (!c || !n) return;

        const screen = Graph.graph2ScreenCoords(c.x / n, c.y / n, c.z / n);

        el.style.left = screen.x + 'px';

        el.style.top = screen.y + 'px';

        el.style.opacity = '1';

      });

    }



    function buildReadouts(nodeCount, edgeCount) {

      document.getElementById('readout-nodes').textContent = nodeCount;

      document.getElementById('readout-edges').textContent = edgeCount;

    }



    // ═══════════════════════════════════════════════

    // Config Panel Builder

    // ═══════════════════════════════════════════════



    function buildConfigPanel() {

      const panel = document.getElementById('config-panel');

      const sections = {};



      for (const [key, cfg] of Object.entries(VFX)) {

        if (!sections[cfg.section]) sections[cfg.section] = [];

        sections[cfg.section].push({ key, ...cfg });

      }



      let html = '';

      for (const [section, items] of Object.entries(sections)) {

        html += `<div class="config-section">`;

        html += `<div class="config-section-title">${section}</div>`;

        for (const item of items) {

          html += `<div class="config-row">`;

          html += `<span class="config-label">${item.label}</span>`;

          if (item.type === 'color') {

            html += `<input type="color" class="config-color" data-key="${item.key}" value="${item.val}">`;

            html += `<span class="config-hex" data-vfx="${item.key}">${item.val}</span>`;

          } else {

            const dec = item.step < 0.01 ? 3 : item.step < 1 ? 2 : 0;

            html += `<input type="range" class="config-slider" data-key="${item.key}" `;

            html += `min="${item.min}" max="${item.max}" step="${item.step}" value="${item.val}">`;

            html += `<span class="config-value" data-vfx="${item.key}">${Number(item.val).toFixed(dec)}</span>`;

          }

          html += `</div>`;

        }

        html += `</div>`;

      }



      panel.innerHTML = html;



      function doRefresh(refresh) {

        if (refresh === 'nodes') scheduleNodeRefresh();

        else if (refresh === 'scale') refreshNodeScales();

        else if (refresh === 'links') refreshLinks();

        else if (refresh === 'colors') refreshColors();

        else if (refresh === 'clusters') refreshClusters();

        else if (refresh === 'postfx') refreshPostFx();

        else if (refresh === 'chrome') refreshChrome();

      }



      // Wire slider events

      panel.querySelectorAll('.config-slider').forEach(slider => {

        slider.addEventListener('input', e => {

          const key = e.target.dataset.key;

          const val = parseFloat(e.target.value);

          VFX[key].val = val;

          const dec = VFX[key].step < 0.01 ? 3 : VFX[key].step < 1 ? 2 : 0;

          panel.querySelector(`[data-vfx="${key}"]`).textContent = val.toFixed(dec);

          doRefresh(VFX[key].refresh);

        });

      });



      // Wire color picker events

      panel.querySelectorAll('.config-color').forEach(picker => {

        picker.addEventListener('input', e => {

          const key = e.target.dataset.key;

          VFX[key].val = e.target.value;

          panel.querySelector(`[data-vfx="${key}"]`).textContent = e.target.value;

          doRefresh(VFX[key].refresh);

        });

      });

    }



    // Toggle color theme

    document.getElementById('theme-toggle').addEventListener('click', () => {

      const names = Object.keys(COLOR_THEMES);

      const next = names[(names.indexOf(currentTheme) + 1) % names.length];

      applyTheme(next);

    });



    // (label-toggle and config panel removed from release build)

  

    // ═══════════════════════════════════════════════

    // Export Snapshot + Copy Graph Link

    // ═══════════════════════════════════════════════

    let latestSessionSnapshot = null;



    function sanitizeExportNamePart(value = '') {

      return String(value).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48) || 'graph';

    }



    function downloadTextFile(filename, content) {

      const blob = new Blob([content], { type: 'text/html;charset=utf-8' });

      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');

      a.href = url;

      a.download = filename;

      document.body.appendChild(a);

      a.click();

      a.remove();

      setTimeout(() => URL.revokeObjectURL(url), 1000);

    }



    function buildStandaloneSnapshotHtml(sourceHtml, session) {

      const json = JSON.stringify(session);

      const b64 = btoa(encodeURIComponent(json).replace(/%([0-9A-F]{2})/g, (m, p1) => String.fromCharCode('0x' + p1)));

      const injection = '<script>window.__TOPOLOGIES_DATA_B64__ = "' + b64 + '";<\/script>\n<script>window.__TOPOLOGIES_SNAPSHOT_MODE__ = true;<\/script>\n';

      const marker = '<script type="module">';

      const idx = sourceHtml.indexOf(marker);

      if (idx === -1) throw new Error('EXPORT FAILED: MODULE SCRIPT NOT FOUND');

      return sourceHtml.slice(0, idx) + injection + sourceHtml.slice(idx);

    }



    async function exportStandaloneSnapshot() {

      // Build session from current graph data

      const session = latestSessionSnapshot || await loadSession().catch(() => null);

      if (!session && !allNodes.length) {

        setBootStage('EXPORT FAILED', 'NO GRAPH DATA AVAILABLE');

        showBootStatus();

        setTimeout(hideBootStatus, 1800);

        return;

      }

      // Use current graph data if no cached session

      const sessionData = session || {

        graphNodes: allNodes.map(n => {

          const clean = {};

          for (const k of ['id','filename','name','text_preview','cluster_id','cluster_name','x_central','y_central','z_central','x_decentral','y_decentral','z_decentral','x_distrib','y_distrib','z_distrib','x_planet','y_planet','z_planet','is_medoid','is_llm_center']) {

            if (n[k] !== undefined) clean[k] = n[k];

          }

          return clean;

        }),

        centralEdges: (edgeSets.central || []).map(e => ({ source: e.source, target: e.target, label_forward: e.label_forward, label_backward: e.label_backward })),

        decentralEdges: (edgeSets.decentral || []).map(e => ({ source: e.source, target: e.target, label_forward: e.label_forward, label_backward: e.label_backward })),

        labeledEdges: (edgeSets.distrib || []).map(e => ({ source: e.source, target: e.target, label_forward: e.label_forward, label_backward: e.label_backward })),
        planetEdges: (edgeSets.planet || []).map(e => ({ source: e.source, target: e.target, label_forward: e.label_forward, label_backward: e.label_backward })),

        clusterNames: {},

        nodeCount: allNodes.length,

      };



      try {

        const exportUrl = new URL(window.location.href);

        exportUrl.search = '';

        exportUrl.hash = '';

        const response = await fetch(exportUrl.toString(), { cache: 'no-store' });

        if (!response.ok) throw new Error('SOURCE HTML ' + response.status);

        const sourceHtml = await response.text();

        const standaloneHtml = buildStandaloneSnapshotHtml(sourceHtml, sessionData);

        const nameBits = [sessionData.nodeCount ? sessionData.nodeCount + '-notes' : '', sanitizeExportNamePart(Object.values(sessionData.clusterNames || {})[0] || '')].filter(Boolean).join('-');

        downloadTextFile('obsidian-universe-' + (nameBits || 'snapshot') + '.html', standaloneHtml);

        setBootStage('SNAPSHOT EXPORTED', 'STANDALONE HTML READY');

        showBootStatus();

        setTimeout(hideBootStatus, 1800);

      } catch (err) {

        // Fallback: simple JSON export

        const json = JSON.stringify(sessionData);

        downloadTextFile('obsidian-universe-snapshot-' + Date.now() + '.json', json);

        setBootStage('SNAPSHOT EXPORTED', 'JSON FALLBACK (COULD NOT FETCH SOURCE)');

        showBootStatus();

        setTimeout(hideBootStatus, 2000);

      }

    }



    function buildCachedGraphLink() {

      const url = new URL(window.location.href);

      url.searchParams.set('resume', 'latest');

      return url.toString();

    }



    async function copyCachedGraphLink() {

      const link = buildCachedGraphLink();

      try {

        if (navigator.clipboard && navigator.clipboard.writeText) {

          await navigator.clipboard.writeText(link);

        } else {

          const temp = document.createElement('textarea');

          temp.value = link;

          temp.setAttribute('readonly', '');

          temp.style.position = 'absolute';

          temp.style.left = '-9999px';

          document.body.appendChild(temp);

          temp.select();

          document.execCommand('copy');

          document.body.removeChild(temp);

        }

        setBootStage('LINK COPIED', 'RESTORES THE LAST GRAPH FROM CACHE');

        showBootStatus();

        setTimeout(hideBootStatus, 1800);

      } catch (err) {

        setBootStage('COPY FAILED', link);

        showBootStatus();

        setTimeout(hideBootStatus, 3000);

      }

    }



    document.getElementById('export-snapshot-btn').addEventListener('click', exportStandaloneSnapshot);

    document.getElementById('copy-graph-link-btn').addEventListener('click', copyCachedGraphLink);



    // Initialize theme
    applyTheme('warm');

    // Check for embedded session (exported snapshot)
    if (window.__TOPOLOGIES_DATA_B64__) {
      const json = decodeURIComponent(Array.from(atob(window.__TOPOLOGIES_DATA_B64__), c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
      const session = JSON.parse(json);
      document.getElementById('setup').classList.add('hidden');
      document.getElementById('main').classList.remove('hidden');
      document.getElementById('reanalyze-btn').classList.remove('hidden');
      document.getElementById('copy-graph-link-btn').classList.remove('hidden');
      document.getElementById('export-snapshot-btn').classList.remove('hidden');
      restoreFromCache(session);
    } else // Auto-resume from URL param

    if (new URLSearchParams(window.location.search).get('resume') === 'latest') {

      loadSession().then(session => {

        if (session) {

          document.getElementById('setup').classList.add('hidden');

          document.getElementById('main').classList.remove('hidden'); document.getElementById('contact-footer').style.display = 'none';

          document.getElementById('reanalyze-btn').classList.remove('hidden');

          document.getElementById('copy-graph-link-btn').classList.remove('hidden');

          restoreFromCache(session);

        }

      }).catch(() => {});

    }



  </script>
