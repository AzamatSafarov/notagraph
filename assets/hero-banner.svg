<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="heroAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#heroBg)"/>

  <g stroke="#f59e0b" stroke-width="0.3" opacity="0.1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <rect x="0" y="0" width="1200" height="3" fill="url(#heroAccent)"/>

  <circle cx="150" cy="200" r="80" fill="none" stroke="url(#heroAccent)" stroke-width="1" opacity="0.12"/>
  <circle cx="150" cy="200" r="120" fill="none" stroke="url(#heroAccent)" stroke-width="0.5" opacity="0.08"/>

  <g transform="translate(150, 200)" opacity="0.2">
    <rect x="-30" y="-20" width="60" height="12" rx="4" fill="url(#heroAccent)" opacity="0.8"/>
    <rect x="-22" y="-2" width="44" height="12" rx="4" fill="url(#heroAccent)" opacity="0.5"/>
    <rect x="-26" y="16" width="52" height="12" rx="4" fill="url(#heroAccent)" opacity="0.3"/>
  </g>

  <text x="600" y="165" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#e6edf3" text-anchor="middle" letter-spacing="-0.5">GitHub Repo Beautifier</text>
  <text x="600" y="215" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#8899aa" text-anchor="middle">Transform any README into a premium product page</text>

  <line x1="460" y1="245" x2="740" y2="245" stroke="url(#heroAccent)" stroke-width="2" stroke-linecap="round"/>

  <g transform="translate(600, 315)" text-anchor="middle">
    <rect x="-240" y="-14" width="80" height="28" rx="6" fill="none" stroke="#e11d48" stroke-width="1.5" opacity="0.6"/>
    <text x="-200" y="5" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" fill="#e11d48" text-anchor="middle">Hero Banner</text>

    <rect x="-140" y="-14" width="80" height="28" rx="6" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
    <text x="-100" y="5" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" fill="#f59e0b" text-anchor="middle">Shields</text>

    <rect x="-40" y="-14" width="80" height="28" rx="6" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <text x="0" y="5" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" fill="#3b82f6" text-anchor="middle">SVG Assets</text>

    <rect x="60" y="-14" width="80" height="28" rx="6" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
    <text x="100" y="5" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" fill="#22c55e" text-anchor="middle">Structure</text>

    <rect x="160" y="-14" width="80" height="28" rx="6" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>
    <text x="200" y="5" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" fill="#a855f7" text-anchor="middle">Copy Style</text>
  </g>

  <rect x="0" y="350" width="1200" height="50" fill="url(#glow)"/>
</svg>
