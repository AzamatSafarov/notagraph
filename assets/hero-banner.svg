<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1000" height="320" fill="url(#sky)"/>
  <!-- Stars -->
  <circle cx="120" cy="80" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="280" cy="50" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="450" cy="90" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="680" cy="60" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="850" cy="100" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="920" cy="70" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="180" cy="140" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="750" cy="120" r="1" fill="#fff" opacity="0.5"/>
  <!-- Central hub (medoid) -->
  <circle cx="500" cy="160" r="10" fill="#4dabf7" filter="url(#glow)"/>
  <!-- Cluster 1 nodes (pink) -->
  <circle cx="350" cy="120" r="7" fill="#ff9ff3"/>
  <circle cx="320" cy="150" r="5" fill="#ff9ff3" opacity="0.7"/>
  <circle cx="380" cy="90" r="6" fill="#ff9ff3" opacity="0.8"/>
  <!-- Cluster 2 nodes (teal) -->
  <circle cx="620" cy="110" r="7" fill="#4ecdc4"/>
  <circle cx="650" cy="80" r="5" fill="#4ecdc4" opacity="0.7"/>
  <circle cx="600" cy="140" r="6" fill="#4ecdc4" opacity="0.8"/>
  <!-- Cluster 3 nodes (purple) -->
  <circle cx="480" cy="240" r="7" fill="#a78bfa"/>
  <circle cx="450" cy="270" r="5" fill="#a78bfa" opacity="0.7"/>
  <circle cx="520" cy="220" r="6" fill="#a78bfa" opacity="0.8"/>
  <!-- Cluster 4 nodes (yellow) -->
  <circle cx="280" cy="200" r="7" fill="#ffd93d"/>
  <circle cx="250" cy="230" r="5" fill="#ffd93d" opacity="0.7"/>
  <!-- Cluster 5 nodes (green) -->
  <circle cx="720" cy="190" r="7" fill="#51cf66"/>
  <circle cx="750" cy="220" r="5" fill="#51cf66" opacity="0.7"/>
  <!-- Connection lines -->
  <line x1="500" y1="160" x2="350" y2="120" stroke="#4dabf7" stroke-width="2" opacity="0.5"/>
  <line x1="500" y1="160" x2="620" y2="110" stroke="#4dabf7" stroke-width="2" opacity="0.5"/>
  <line x1="500" y1="160" x2="480" y2="240" stroke="#4dabf7" stroke-width="2" opacity="0.5"/>
  <line x1="500" y1="160" x2="280" y2="200" stroke="#4dabf7" stroke-width="2" opacity="0.5"/>
  <line x1="500" y1="160" x2="720" y2="190" stroke="#4dabf7" stroke-width="2" opacity="0.5"/>
  <!-- Cross cluster links -->
  <line x1="350" y1="120" x2="280" y2="200" stroke="#4dabf7" stroke-width="1" opacity="0.2"/>
  <line x1="620" y1="110" x2="720" y2="190" stroke="#4dabf7" stroke-width="1" opacity="0.2"/>
  <line x1="480" y1="240" x2="280" y2="200" stroke="#4dabf7" stroke-width="1" opacity="0.2"/>
  <!-- Distant nodes (smaller) -->
  <circle cx="180" cy="100" r="3" fill="#ff9ff3" opacity="0.5"/>
  <circle cx="820" cy="140" r="3" fill="#4ecdc4" opacity="0.5"/>
  <circle cx="400" cy="280" r="3" fill="#ffd93d" opacity="0.5"/>
  <line x1="350" y1="120" x2="180" y2="100" stroke="#4dabf7" stroke-width="1" opacity="0.15"/>
  <line x1="620" y1="110" x2="820" y2="140" stroke="#4dabf7" stroke-width="1" opacity="0.15"/>
  <!-- Title text -->
  <text x="500" y="260" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#fff" text-anchor="middle" opacity="0.9">Neural Cartography of Ideas</text>
</svg>