<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 92">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8f5ef"/>
      <stop offset="100%" stop-color="#e8e2d8"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="46" cy="46" r="42" fill="url(#bg)" stroke="#4dabf7" stroke-width="2" opacity="0.3"/>
  <!-- Central node -->
  <circle cx="46" cy="46" r="6" fill="#4dabf7"/>
  <!-- Orbiting nodes with different cluster colors -->
  <circle cx="30" cy="32" r="4" fill="#ff9ff3"/>
  <circle cx="62" cy="30" r="4" fill="#4ecdc4"/>
  <circle cx="64" cy="58" r="4" fill="#a78bfa"/>
  <circle cx="32" cy="62" r="4" fill="#ffd93d"/>
  <!-- Connection lines -->
  <line x1="46" y1="46" x2="30" y2="32" stroke="#4dabf7" stroke-width="1.5" opacity="0.6"/>
  <line x1="46" y1="46" x2="62" y2="30" stroke="#4dabf7" stroke-width="1.5" opacity="0.6"/>
  <line x1="46" y1="46" x2="64" y2="58" stroke="#4dabf7" stroke-width="1.5" opacity="0.6"/>
  <line x1="46" y1="46" x2="32" y2="62" stroke="#4dabf7" stroke-width="1.5" opacity="0.6"/>
  <!-- Cross connections -->
  <line x1="30" y1="32" x2="62" y2="30" stroke="#4dabf7" stroke-width="1" opacity="0.3"/>
  <line x1="62" y1="30" x2="64" y2="58" stroke="#4dabf7" stroke-width="1" opacity="0.3"/>
</svg>